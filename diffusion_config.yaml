# =============================================================================
# DATA PATHS AND FILES
# =============================================================================

data:
  # Input data paths
  data_path: "data/hww_mangled_1M_MG_final"
  raw_data_path: "data/mangled_hww_1M_MG_no_cuts"
  processed_features_path: "data/hww_mangled_1M_MG_final_X"
  processed_targets_path: "data/hww_mangled_1M_MG_final_y"
  detector_sim_path: "data/hww_sherpa_1M_MG_final_detector_sim"
  truth_path: "data/hww_mangled_1M_MG_final_truth"
  
  # Coordinated preprocessed datasets (generated by preprocess_diffusion_data.py)
  detector_dataset_path: "diffusion_training_dataset.csv"
  truth_dataset_path: "diffusion_training_targets.csv"
  
  # Optional separate validation datasets (if provided, override train/val split)
  # detector_val_dataset_path: "diffusion_validation_dataset.csv"
  # truth_val_dataset_path: "diffusion_validation_targets.csv"
  
  # Input file pairs for preprocessing
  preprocessing:
    detector_files:
      - "data/hww_1M_MG_final_detector_sim_cuts.csv"
      - "data/ww_1M_MG_final_detector_sim_cuts.csv"
      - "data/ttbar_1M_MG_final_detector_sim_cuts.csv"
      - "data/ztautau_1M_MG_final_detector_sim_cuts.csv"
      # - "data/hww_mangled_1M_MG_final_detector_sim_cuts.csv"
    truth_files:
      - "data/hww_1M_MG_final_truth_cuts.csv"
      - "data/ww_1M_MG_final_truth_cuts.csv"
      - "data/ttbar_1M_MG_final_truth_cuts.csv"
      - "data/ztautau_1M_MG_final_truth_cuts.csv"
      # - "data/hww_mangled_1M_MG_final_truth_cuts.csv"

    # Optional separate validation file pairs for preprocessing
    validation_detector_files:
      # - "data/ww_1M_MG_final_detector_sim_cuts.csv"
      # - "data/ttbar_1M_MG_final_detector_sim_cuts.csv"
    validation_truth_files:
      # - "data/ww_1M_MG_final_truth_cuts.csv"
      # - "data/ttbar_1M_MG_final_truth_cuts.csv"


# =============================================================================
# DATA PROCESSING CONFIGURATION
# =============================================================================

data_processing:
  # Filtering parameters
  max_zero_columns: 2  # Remove rows with more than this many zero values

  # Conditioning feature parameters
  pt_conditioning_moments: 3
  eta_conditioning_moments: 0
  phi_conditioning_moments: 0
  mt_conditioning_moments: 0
  px_conditioning_moments: 0
  py_conditioning_moments: 0
  predict_conditioning_features: true
  
  # Normalization ranges (in GeV)
  eta_range: 2.5
  phi_range: 3.5
  pT_range: 300
  E_range: 500
  
  # Data dimensions
  n_dims: 8  # 4 components for each of 2 neutrinos (E, px, py, pz)

  # Numerical stability parameters
  epsilon: 1e-8

  # Histogram/binning parameters
  histogram_bins: 50  # Number of bins for mode calculation

  # Shuffling and sampling
  random_state: 42
  max_rows: null  # Set to integer to limit dataset size, null for no limit

# =============================================================================
# MODEL ARCHITECTURE
# =============================================================================

model:
  # Input/output dimensions (calculated automatically if null)
  input_dim: null  # Will be calculated: 12 (detector 4-vecs) + conditioning features
  output_dim: 8    # 2 neutrinos × 4 components each
  
  # Network architecture
  hidden_dim: 512
  num_layers: 14
  time_dim: 128
  
  # Diffusion parameters
  beta_1: 0.00097
  beta_T: 0.049
  T: 1200

# =============================================================================
# TRAINING CONFIGURATION
# =============================================================================

training:
  # Training parameters
  epochs: 500
  batch_size: 1024
  learning_rate: 0.00069
  weight_decay: 2.267e-05
  
  # Data splitting
  train_split: 0.9
  validation_split: 0.1
  
  # Checkpointing
  save_interval: 25
  save_checkpoints: true
  
  # Set patience <= 0 to disable early stopping
  early_stopping_patience: 35
  early_stopping_restore_best: true
  
  # Training type identifier
  train_type: "diffusion_unified"

# =============================================================================
# UNFOLDING CONFIGURATION
# =============================================================================

unfolding:
  # Unfolding parameters
  unfold_size: 400000  # Maximum number of events to unfold
  sample_size: 1024   # Batch size for unfolding
  
  # Unfolding type identifier
  unf_type: "lepqua_CT14lo"
  
  # Output format
  output_format: "lorentz_vectors"  # Options: "arrays", "lorentz_vectors"

# =============================================================================
# SYSTEM CONFIGURATION
# =============================================================================

system:
  # Random seed
  seed: 42
  random_seed: false
  
  # Device configuration
  device: "cuda"  # Will fallback to CPU if CUDA not available
  
  # Output paths
  output_path: "./outputs/diffusion_pt_all_unfold_mangled/"
  plots_path: "./plots/diffusion_pt_all_unfold_mangled/"
  ckpt_path: "./model-state/diffusion_pt_all_unfold_mangled"
  
  # Logging
  verbose: false

# =============================================================================
# EVALUATION CONFIGURATION
# =============================================================================

evaluation:
  # Bell test configuration
  enable_bell_tests: true
  
  # Gell-Mann matrix calculation
  enable_gellmann: true
  
  # Mode calculation settings
  mode_calculation:
    method: "kde"  # Options: "histogram", "kde", "gaussian_fit"
    n_samples_for_modes: 100
    
  # Reconstruction quality metrics
  quality_metrics:
    - "mae"
    - "mse" 
    - "rmse"

# =============================================================================
# COMPATIBILITY SETTINGS
# =============================================================================

compatibility:
  # Ensure output format matches existing reconstruction methods
  output_format: "lorentz_vectors"  # Options: "arrays", "lorentz_vectors"
  
  # Integration with existing data preprocessing
  use_existing_preprocessor: true
  
  # Evaluation integration
  integrate_with_evaluation: true
  
  # Legacy support
  load_preprocessed_training_data: true
